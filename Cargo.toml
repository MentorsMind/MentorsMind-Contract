[workspace]
resolver = "2"
members = [
    "escrow",
    "shared",
    "rbac",
    "treasury",
    "staking",
    "governance",
    "timelock",
    "upgrade_registry",
    # "multisig",
    # "payment-router",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[workspace.dependencies]
soroban-sdk = "21.7.7"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
