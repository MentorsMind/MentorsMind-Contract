[workspace]
resolver = "2"
members = [
    "contracts/governance",
    "contracts/staking",
    "escrow",
    "multisig",
    "tools",
    "contracts/health_dashboard",
    "contracts/mnt-token",
    "contracts/shared",
    "contracts/verification",
    "contracts/referral",
    "contracts/referral_leaderboard",
    "benchmarks",
    "contracts/treasury",
    "contracts/timelock",
    "contracts/payment_router",
    "contracts/dispute_evidence",
    "contracts/lending_pool",
    "contracts/credit_score",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[workspace.dependencies]
soroban-sdk = "21.0.0"
soroban-token-sdk = "21.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
